[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeconfig"
version = "0.1.0"
description = "EdgeX slice I/O commissioning tool"
requires-python = ">=3.8"
license = { text = "Proprietary" }
dependencies = ["pyserial>=3.5", "gpiod>=2.0"]

[project.scripts]
edgeconfig = "edgeconfig.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgeconfig*"]

# IODD 는 코드가 아니라 자료다. 이 줄이 없으면 setuptools 가 .py 만 담아 가고,
# 설치본에는 iodd/ 폴더 자체가 생기지 않는다 — 툴은 프로세스 데이터를 바이트까지만
# 보여 주고 Browse... 는 없는 폴더를 열려다 죽는다.
[tool.setuptools.package-data]
edgeconfig = ["iodd/*.xml", "iodd/*.zip", "iodd/README.md"]
